# Checks every push to main and every pull request: lint, types, tests, both
# store builds and the manifest check. CI builds have no Entra client ID
# (.env.production.local is git-ignored), so they're checks, not store packages.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:edge
      - run: pnpm check:manifest
