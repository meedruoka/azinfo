# Builds the Edge store package from main and uploads it to Partner Center
# through the Edge Add-ons API. Started by hand only (Actions > Release to
# Edge > Run workflow). By default it only replaces the draft; tick "publish"
# to submit for certification. Nothing reaches users before Microsoft approves.
#
# Needs, as repository settings (Settings > Secrets and variables > Actions):
#   secrets   EDGE_CLIENT_ID, EDGE_API_KEY   (Partner Center > Publish API)
#   variables EDGE_PRODUCT_ID                (Product ID of the extension)
#             ENTRA_CLIENT_ID                (production app registration "azinfo")
# Only this workflow reads them, and it runs on main only.
name: Release to Edge

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Submit for certification after uploading (otherwise upload to the draft only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-edge
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Store builds sign in through the production registration; the client ID isn't a secret.
      WXT_ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      WXT_ENTRA_AUTHORITY: organizations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check release settings
        run: |
          [ -n "$WXT_ENTRA_CLIENT_ID" ] || { echo "::error::Repository variable ENTRA_CLIENT_ID is not set"; exit 1; }
          [ -n "${{ vars.EDGE_PRODUCT_ID }}" ] || { echo "::error::Repository variable EDGE_PRODUCT_ID is not set"; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm compile
      - run: pnpm test

      - run: pnpm build
      - run: pnpm zip:edge
      - run: pnpm check:manifest

      - name: Confirm the package uses the production client ID
        run: |
          count=$(grep -c "$WXT_ENTRA_CLIENT_ID" .output/edge-mv3/background.js || true)
          [ "$count" = "1" ] || { echo "::error::Expected the production client ID once in background.js, found $count"; exit 1; }

      - name: Keep the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-package
          path: .output/*-edge.zip
          retention-days: 30

      - name: Upload to Edge Add-ons
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          PUBLISH: ${{ inputs.publish }}
        run: node scripts/edge-publish.mjs $([ "$PUBLISH" = "true" ] && echo --publish)
