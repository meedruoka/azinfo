<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>azinfo store screenshots</title>
    <style>
      :root {
        --page: #f5f5f5;
        --bar: #e6e6e6;
        --card: #ffffff;
        --block: #e9e9e9;
        --text: #242424;
        --muted: #707070;
        color-scheme: light dark;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #161616;
          --bar: #222222;
          --card: #1d1d1d;
          --block: #2b2b2b;
          --text: #eeeeee;
          --muted: #9a9a9a;
        }
      }
      html, body { margin: 0; height: 100%; background: var(--page); color: var(--text); overflow: hidden; }
      .bar { height: 44px; background: var(--bar); display: flex; align-items: center; padding: 0 20px; gap: 12px; }
      .bar .dot { width: 18px; height: 18px; border-radius: 4px; background: var(--block); }
      .bar .search { margin: 0 auto; width: 420px; height: 24px; border-radius: 4px; background: var(--card); }
      .layout { display: flex; height: calc(100% - 44px); }
      nav { width: 220px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
      nav span { height: 12px; border-radius: 3px; background: var(--block); }
      nav span:nth-child(odd) { width: 70%; }
      main { flex: 1; padding: 28px 32px; }
      h1 { margin: 0; font-size: 24px; font-weight: 600; }
      .sub { color: var(--muted); margin: 4px 0 24px; font-size: 14px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 760px; }
      .card { background: var(--card); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
      .card span { height: 10px; border-radius: 3px; background: var(--block); }
      .card span:nth-child(2) { width: 60%; }
      .card span:nth-child(3) { width: 80%; }
      /* Popup: the extension's toolbar popup, drawn under the browser toolbar. */
      .popup-frame { position: fixed; top: 52px; right: 24px; width: 420px; background: Canvas; color: CanvasText;
        border: 1px solid var(--block); border-radius: 8px; box-shadow: 0 8px 28px rgb(0 0 0 / 0.25); overflow: hidden; }
      .options-frame { position: fixed; inset: 44px 0 0 0; background: var(--page); overflow: auto; }
    </style>
  </head>
  <body>
    <div class="bar"><span class="dot"></span><span class="search"></span><span class="dot"></span></div>
    <div class="layout">
      <nav><span></span><span></span><span></span><span></span><span></span><span></span><span></span></nav>
      <main>
        <h1 id="title">Resource</h1>
        <p class="sub" id="subtitle"></p>
        <div class="grid">
          <div class="card"><span></span><span></span><span></span></div>
          <div class="card"><span></span><span></span><span></span></div>
          <div class="card"><span></span><span></span><span></span></div>
          <div class="card"><span></span><span></span><span></span></div>
        </div>
      </main>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
